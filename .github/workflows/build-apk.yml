name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is not committed; generate it around our lib/ + pubspec.yaml
      - name: Generate Android project
        run: flutter create --platforms=android --org pro.yashchauhan --project-name glob_app .

      - name: Patch manifest (internet permission, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS=""
          for p in INTERNET ACCESS_NETWORK_STATE CHANGE_NETWORK_STATE RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA BLUETOOTH BLUETOOTH_CONNECT WAKE_LOCK POST_NOTIFICATIONS VIBRATE FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PROJECTION FOREGROUND_SERVICE_MICROPHONE FOREGROUND_SERVICE_CAMERA USE_FULL_SCREEN_INTENT; do
            PERMS="$PERMS<uses-permission android:name=\"android.permission.$p\"/>\n    "
          done
          sed -i "s#<application#${PERMS}<application#" "$M"
          sed -i 's#android:label="[^"]*"#android:label="Glob"#' "$M"
          # the incoming-call screen plugin needs the main activity to be a single instance
          sed -i 's#android:launchMode="[^"]*"#android:launchMode="singleInstance"#' "$M"
          # screen sharing on Android runs as a foreground service
          sed -i 's#</application>#<service android:name="de.julianassmann.flutter_background.IsolateHolderService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>#' "$M"
          grep -n "INTERNET\|label\|launchMode\|IsolateHolderService" "$M"

      # flutter_local_notifications needs Java desugaring; the audio recorder needs minSdk 23+
      - name: Patch Gradle (desugaring, minSdk)
        run: |
          F=android/app/build.gradle.kts
          sed -i 's#sourceCompatibility = JavaVersion#isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion#' "$F"
          sed -i 's#minSdk = flutter.minSdkVersion#minSdk = 24#' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"
          grep -n "isCoreLibraryDesugaringEnabled\|minSdk\|coreLibraryDesugaring" "$F"

      # Android lint crashes on this JDK/AGP combo inside plugins, and some plugins are compiled against an
      # older Android SDK than their dependencies want: skip lint, raise their compileSdk to 36.
      - name: Patch root Gradle (no lintVital, compileSdk 36 for plugins)
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          allprojects { tasks.whenTaskAdded { if (name.startsWith("lintVital")) { enabled = false } } }

          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val ext = extensions.findByName("android")
                      if (ext != null) {
                          ext.javaClass.methods.firstOrNull { it.name == "setCompileSdk" && it.parameterCount == 1 }?.invoke(ext, 36)
                      }
                  }
              }
          }
          EOF
          tail -15 android/build.gradle.kts

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=https://api.glob.yashchauhan.pro \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      # Sign with OUR permanent key so every new APK installs over the old one (no data loss)
      - name: Sign APK with release keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk unsigned.apk
          # drop any existing (debug) signature, re-align, then sign cleanly with v1+v2+v3
          zip -q -d unsigned.apk 'META-INF/*' || true
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out glob.apk aligned.apk
          $BT/apksigner verify -v --print-certs glob.apk | head -12
          $BT/aapt2 dump badging glob.apk | grep -E "package:|sdkVersion|targetSdk|native-code|compileSdk" || true
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: glob-apk
          path: glob.apk

      # Every push to main also publishes a downloadable Release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glob build ${{ github.run_number }}
          files: glob.apk
          make_latest: true
