name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is not committed; generate it around our lib/ + pubspec.yaml
      - name: Generate Android project
        run: flutter create --platforms=android --org pro.yashchauhan --project-name glob_app .

      - name: Patch manifest (internet permission, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS=""
          for p in INTERNET ACCESS_NETWORK_STATE CHANGE_NETWORK_STATE RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA BLUETOOTH BLUETOOTH_CONNECT WAKE_LOCK; do
            PERMS="$PERMS<uses-permission android:name=\"android.permission.$p\"/>\n    "
          done
          sed -i "s#<application#${PERMS}<application#" "$M"
          sed -i 's#android:label="[^"]*"#android:label="Glob"#' "$M"
          grep -n "INTERNET\|label" "$M"

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=https://api.glob.yashchauhan.pro

      # Sign with OUR permanent key so every new APK installs over the old one (no data loss)
      - name: Sign APK with release keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk glob.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            glob.apk
          $BT/apksigner verify --print-certs glob.apk | head -3
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: glob-apk
          path: glob.apk

      # Every push to main also publishes a downloadable Release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glob build ${{ github.run_number }}
          files: glob.apk
          make_latest: true
